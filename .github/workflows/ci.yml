name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
      TEST_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Reports known vulnerabilities in what ships to production. Reviewed, not blocking, until the Prisma CLI chain is updated.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
