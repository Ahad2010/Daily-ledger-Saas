services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_local
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    volumes: ["ledger_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10
volumes:
  ledger_pg:
